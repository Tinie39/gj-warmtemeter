<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GJ Warmtemeter</title><style>body{font:16px system-ui;background:#f1f5f3;color:#173b34;margin:0;padding:16px;max-width:700px;margin:auto}.head,.card{background:white;border-radius:16px;padding:18px;margin:12px 0}.head{background:#174b45;color:white}h1{margin:0}h2{font-size:18px}small{color:#64756f}.head small{color:#d4e4df}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#e9f2ee;padding:12px;border-radius:12px}.stat b{display:block;font-size:22px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd8d3;border-radius:10px;font:inherit;margin:4px 0 10px}button{background:#174b45;color:white;border:0;font-weight:600}.secondary{background:#e9f2ee;color:#174b45}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 3px;border-bottom:1px solid #e3ebe7}td:last-child,th:last-child{text-align:right}.bar{height:9px;background:#e5ece8;border-radius:9px}.bar span{display:block;height:100%;background:#478c7d;border-radius:9px}</style></head><body><header class="head"><h1>GJ Warmtemeter</h1><small>Ennatuurlijk · gegevens lokaal op deze telefoon</small></header><section class="card"><h2>Overzicht</h2><div class="stats"><div class="stat"><small>Totaal verbruik</small><b id="total">1,164 GJ</b></div><div class="stat"><small>Geschatte kosten</small><b id="cost">€ 0,00</b></div></div></section><section class="card"><h2>Meterstand toevoegen</h2><label>Datum</label><input id="date" type="date"><label>Meterstand (GJ)</label><input id="reading" type="number" step="0.001" placeholder="55.583"><button onclick="add()">Opslaan</button></section><section class="card"><h2>Tarieven</h2><label>Levering per GJ (€)</label><input id="rate" type="number" step="0.0001" value="40.9706"><label>Vast per dag (€)</label><input id="fixed" type="number" step="0.0001" value="2.2682"><button class="secondary" onclick="rates()">Tarieven bewaren</button><small>Startwaarden uit de aangeleverde Ennatuurlijk-gegevens. Controleer actuele tarieven.</small></section><section class="card"><h2>Historie</h2><table><thead><tr><th>Datum</th><th>Meterstand</th><th>Verbruik</th></tr></thead><tbody id="history"></tbody></table><button class="secondary" onclick="csv()">Exporteer CSV</button></section><section class="card"><h2>Maandverbruik</h2><div id="bars"></div></section><script>const seed=[['2026-07-01',54.419],['2026-08-01',54.700],['2026-09-01',55.035],['2026-10-01',55.321],['2026-11-01',55.583]];let data=JSON.parse(localStorage.getItem('gj_data')||'null')||seed;let rate=Number(localStorage.getItem('gj_rate')||40.9706),fixed=Number(localStorage.getItem('gj_fixed')||2.2682);const $=x=>document.getElementById(x);$('rate').value=rate;$('fixed').value=fixed;$('date').value=new Date().toISOString().slice(0,10);const money=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n),num=n=>new Intl.NumberFormat('nl-NL',{maximumFractionDigits:3}).format(n);function save(){data.sort((a,b)=>a[0].localeCompare(b[0]));localStorage.setItem('gj_data',JSON.stringify(data));draw()}function add(){let d=$('date').value,v=Number($('reading').value);if(!d||!Number.isFinite(v)||v<0){alert('Vul datum en meterstand in.');return}data=data.filter(x=>x[0]!==d);data.push([d,v]);$('reading').value='';save()}function rates(){rate=Number($('rate').value)||0;fixed=Number($('fixed').value)||0;localStorage.setItem('gj_rate',rate);localStorage.setItem('gj_fixed',fixed);draw()}function draw(){data.sort((a,b)=>a[0].localeCompare(b[0]));let total=0,variable=0,html='',bars='',uses=[];for(let i=1;i<data.length;i++){let u=data[i][1]-data[i-1][1];uses.push(u);total+=u;variable+=Math.max(0,u)*rate;html+=`<tr><td>${new Date(data[i][0]+'T12:00:00').toLocaleDateString('nl-NL')}</td><td>${num(data[i][1])}</td><td>${num(u)} GJ</td></tr>`}if(data.length)html=`<tr><td>${new Date(data[0][0]+'T12:00:00').toLocaleDateString('nl-NL')}</td><td>${num(data[0][1])}</td><td>—</td></tr>`+html;let days=data.length>1?(new Date(data.at(-1)[0])-new Date(data[0][0]))/86400000:0;$('total').textContent=num(total)+' GJ';$('cost').textContent=money(variable+days*fixed);$('history').innerHTML=html||'<tr><td colspan="3">Geen gegevens</td></tr>';let max=Math.max(.001,...uses);uses.forEach((u,i)=>bars+=`<p>${data[i+1][0].slice(0,7)} · ${num(u)} GJ</p><div class="bar"><span style="width:${Math.max(2,u/max*100)}%"></span></div>`);$('bars').innerHTML=bars||'<small>Nog geen maandgegevens.</small>'}function csv(){let s='Datum;Meterstand_GJ\n'+data.map(x=>x[0]+';'+String(x[1]).replace('.',',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='gj-warmtehistorie.csv';a.click();URL.revokeObjectURL(a.href)}draw();</script></body></html>
